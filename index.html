<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>投げ込み</title>
<meta name="description" content="思いついたことを素早く投げ込み、あとで整理・実行するためのアプリ">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="投げ込み">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e2e0da;
  --accent: #2f6f5e;
  --accent-text: #ffffff;
  --accent-soft: #e3efe9;
  --danger: #b3261e;
  --warn: #9a6200;
  --ok: #2f7a4f;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414;
    --surface: #1e1e1f;
    --surface-2: #2a2a2c;
    --text: #f2f2f2;
    --muted: #a1a1a6;
    --line: #333336;
    --accent: #66b69c;
    --accent-text: #0c1f19;
    --accent-soft: #1f3029;
    --danger: #ff8a80;
    --warn: #e0b04f;
    --ok: #7dcf9c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; } /* ダブルタップでの拡大を止める */
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  /* 国産の日本語フォントだけを指定する(メイリオ → ヒラギノ角ゴ → 游ゴシック) */
  font-family: "Meiryo", "メイリオ", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", "Yu Gothic", "YuGothic", "游ゴシック", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
code { font-family: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ヘッダー */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 4px;
  padding: calc(var(--safe-top) + 6px) 12px 6px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 16px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px;
  display: grid; place-items: center; font-size: 22px; color: var(--text);
}
.icon-btn:active { background: var(--surface-2); }
.sync-chip {
  min-width: 48px; height: 32px; padding: 0 10px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.sync-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync-chip[data-state="synced"] .dot { background: var(--ok); }
.sync-chip[data-state="pending"] .dot, .sync-chip[data-state="offline"] .dot { background: var(--warn); }
.sync-chip[data-state="syncing"] .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
.sync-chip[data-state="error"] { color: var(--danger); border-color: var(--danger); }
.sync-chip[data-state="error"] .dot { background: var(--danger); }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

main { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(var(--safe-bottom) + 110px); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 4px 8px calc(var(--safe-bottom) + 4px); background: color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 50px;
  color: var(--muted); text-decoration: none; font-size: 11px; border-radius: 12px;
}
.tabbar a .ti { font-size: 20px; line-height: 1.2; }
.tabbar a.on { color: var(--accent); font-weight: 700; }
.tabbar[hidden] { display: none; }
.view[hidden] { display: none; }
.section-title { margin: 20px 4px 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

/* 投げ込み欄 */
.capture { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
.capture textarea {
  display: block; width: 100%; min-height: 34px; max-height: 40vh; resize: none;
  border: 0; outline: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 4px 4px;
}
.capture-actions { display: flex; justify-content: space-between; align-items: center; gap: 4px 8px; margin-top: 2px; flex-wrap: wrap; }
.capture-actions .left { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; }
.capture-actions > .btn { margin-left: auto; }
.split-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding-left: 2px; font-size: 12px; color: var(--muted); }
.split-toggle input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.btn {
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:disabled { opacity: .4; }
.btn-danger { color: var(--danger); }
.btn-block { width: 100%; }

/* インボックス件数 */
.inbox-link {
  display: flex; align-items: center; justify-content: space-between; margin-top: 12px;
  padding: 0 14px; min-height: 46px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--text);
}
.inbox-link .count { font-weight: 700; font-size: 16px; }
.inbox-link .count.zero { color: var(--muted); font-weight: 400; font-size: 14px; }
.chev { color: var(--muted); margin-left: 8px; }

/* 1件表示 */
.focus-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; min-height: 130px; display: flex; flex-direction: column;
}
.focus-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.focus-title {
  margin: 8px 0 4px; font-size: 18px; font-weight: 600; line-height: 1.4; word-break: break-word;
  background: none; border: 0; padding: 0; text-align: left;
}
.focus-note { color: var(--muted); font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
.focus-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 12px; }
.focus-actions.three { grid-template-columns: 1fr 1fr 1fr; }
.focus-actions.three .btn { padding: 0 4px; white-space: nowrap; }
.focus-timer { margin: 2px 0 2px; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.focus-timer small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.focus-timer.over { color: var(--warn); }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 8px; }

/* 期限・見込み時間 */
.due-overdue { color: var(--danger); font-weight: 600; }
.due-today { color: var(--warn); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  min-height: 34px; padding: 0 11px; border-radius: 17px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; color: var(--text); white-space: nowrap;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chips input[type=date], .chips input[type=number] {
  min-height: 36px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 16px; width: auto;
}
.chips input[type=number] { width: 5.5em; }
.picker-label { font-size: 12px; color: var(--muted); margin: 0 2px 4px; }
.opts-btn { min-height: 40px; padding: 0 6px; border: 0; background: none; color: var(--accent); font-size: 12px; text-align: left; }
.capture-opts { border-top: 1px solid var(--line); margin-top: 6px; padding: 10px 2px 2px; display: grid; gap: 10px; }

/* リストの編集 */
.list-row { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 8px 4px 14px; }
.list-row .nm { flex: 1; min-width: 0; word-break: break-word; }
.list-row .nm small { color: var(--muted); margin-left: 6px; font-size: 11px; }
.mini-btn { min-width: 40px; min-height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; color: var(--text); }
.mini-btn:disabled { opacity: .3; }
.list-add { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.list-add .field { margin: 0; }
.lists-note { font-size: 12px; color: var(--muted); margin: 10px 4px 0; }

/* 整理の依頼 */
.organize-btn {
  width: 100%; min-height: 40px; margin-top: 6px; border-radius: 12px; border: 1px dashed var(--accent);
  background: none; color: var(--accent); font-size: 13px; font-weight: 600;
}
.organize-btn:disabled { opacity: .7; border-style: solid; }

/* リストの件数 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile {
  display: flex; flex-direction: column; justify-content: center; gap: 0; min-height: 52px; padding: 6px 10px;
  border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none;
}
.tile .name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .num { font-size: 17px; font-weight: 700; line-height: 1.3; }
.tile .num.zero { color: var(--muted); font-weight: 400; }
.tile .num small { font-size: 11px; font-weight: 600; margin-left: 6px; }

/* すきま時間 */
.gap-head { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 44px; margin-top: 16px;
  padding: 0 4px; border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.gap-hint { font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
.search-panel { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.search-panel .picker-label { margin-top: 4px; }
.chip small { color: var(--muted); font-weight: 400; margin-left: 2px; }
.filter-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px;
  padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: 13px; font-weight: 600; }
.search-summary { margin-left: 8px; color: var(--accent); font-weight: 600; }
.row-start { flex: none; align-self: center; margin-right: 10px; min-height: 36px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; font-size: 14px; }

/* 一覧 */
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.rows:empty { display: none; }
.row { display: flex; align-items: flex-start; gap: 4px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.check {
  flex: none; width: 44px; min-height: 46px; border: 0; background: transparent; display: grid; place-items: center;
}
.check::before {
  content: ""; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); display: block;
}
.check.is-done::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.row-body { flex: 1; min-width: 0; padding: 11px 12px 10px 0; border: 0; background: transparent; text-align: left; }
.row-title { word-break: break-word; }
.row.done .row-title { color: var(--muted); text-decoration: line-through; }
.row-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tag { background: var(--surface-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.tag:active { background: var(--accent-soft); }
.toggle-done { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--muted); font-size: 14px; min-height: 44px; padding: 0 12px; }

/* メニュー */
.menu-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.menu-list li + li { border-top: 1px solid var(--line); }
.menu-list a {
  display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 14px;
  color: var(--text); text-decoration: none;
}
.menu-list .n { color: var(--muted); font-size: 13px; }

/* フォーム */
.field { display: block; margin-bottom: 14px; }
.field > span, .field > label > span { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
.field input, .field textarea, .field select {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
.field textarea { resize: none; min-height: 46px; line-height: 1.5; display: block; }
.tag-picker { margin-top: 8px; }
.tag-picker .chip.add { border-style: dashed; color: var(--accent); }
.field .chip small { display: inline; margin: 0 0 0 4px; font-size: 12px; }
.tag-picker .tag-new { font-size: 12px; color: var(--muted); margin: 0 2px; }
.field small { display: block; font-size: 12px; color: var(--muted); margin: 6px 4px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card p { margin: 0 0 8px; }
.status-line { font-size: 13px; color: var(--muted); }
.status-line.err { color: var(--danger); white-space: pre-wrap; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* 編集ダイアログ */
dialog {
  border: 0; padding: 0; width: 100%; max-width: 640px; max-height: 100%; height: 100%;
  margin: 0 auto; background: var(--bg); color: var(--text);
}
@media (min-width: 700px) { dialog { height: auto; max-height: 90vh; margin: 5vh auto; border-radius: 16px; } }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-head {
  position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center;
  padding: calc(var(--safe-top) + 6px) 8px 6px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.dlg-head h2 { margin: 0; font-size: 17px; }
.dlg-head .text-btn { min-height: 44px; padding: 0 12px; border: 0; background: none; font-size: 16px; color: var(--accent); }
.dlg-head .text-btn.strong { font-weight: 700; }
.dlg-body { padding: 16px 16px calc(var(--safe-bottom) + 24px); }
.dlg-foot { display: grid; gap: 10px; margin-top: 8px; }
.dlg-info { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.7; }

/* トースト */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 72px); transform: translateX(-50%);
  z-index: 50; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px;
  background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px;
  font-size: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; min-height: 36px; padding: 0 8px; text-decoration: underline; }
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="nav-btn" type="button" aria-label="メニュー">☰</button>
  <h1 id="title">投げ込み</h1>
  <button class="sync-chip" id="sync-chip" type="button" data-state="local" aria-label="同期の状態">
    <span class="dot"></span><span id="sync-label">端末内のみ</span>
  </button>
</header>

<main>
  <!-- ホーム -->
  <section class="view" id="view-home">
    <form class="capture" id="capture-form" autocomplete="off">
      <textarea id="capture-text" rows="1" aria-label="投げ込み欄" placeholder="思いついたことを書く" enterkeyhint="enter"></textarea>
      <div class="capture-actions">
        <div class="left">
          <label class="split-toggle"><input type="checkbox" class="split-check"> 1行ずつ別の項目にする</label>
          <button type="button" class="opts-btn">期限・見込み ▾</button>
        </div>
        <button class="btn btn-primary" type="submit" id="capture-btn" disabled>追加</button>
      </div>
      <div class="capture-opts" hidden>
        <div><div class="picker-label">期限</div>
          <div class="chips due-picker"><button type="button" class="chip" data-set="">なし</button><button type="button" class="chip" data-set="today">今日</button><button type="button" class="chip" data-set="week">今週</button><input type="date" aria-label="期限の日付"></div></div>
        <div><div class="picker-label">見込み時間</div>
          <div class="chips est-picker"><button type="button" class="chip" data-set="">なし</button><button type="button" class="chip" data-set="5">5分</button><button type="button" class="chip" data-set="15">15分</button><button type="button" class="chip" data-set="30">30分</button><button type="button" class="chip" data-set="60">60分</button><input type="number" inputmode="numeric" min="1" max="1440" placeholder="分" aria-label="見込み時間(分)"></div></div>
      </div>
    </form>
    <div id="home-dynamic"></div>
  </section>

  <!-- 1件表示と絞り込み -->
  <section class="view" id="view-focus" hidden><div id="focus-dynamic"></div></section>

  <!-- リスト確認 -->
  <section class="view" id="view-overview" hidden></section>

  <!-- リスト -->
  <section class="view" id="view-list" hidden>
    <form class="capture" id="list-capture-form" autocomplete="off">
      <textarea id="list-capture-text" rows="1" aria-label="このリストに追加" placeholder="このリストに追加" enterkeyhint="enter"></textarea>
      <div class="capture-actions">
        <div class="left">
          <label class="split-toggle"><input type="checkbox" class="split-check"> 1行ずつ別の項目にする</label>
          <button type="button" class="opts-btn">期限・見込み ▾</button>
        </div>
        <button class="btn btn-primary" type="submit" id="list-capture-btn" disabled>追加</button>
      </div>
      <div class="capture-opts" hidden>
        <div><div class="picker-label">期限</div>
          <div class="chips due-picker"><button type="button" class="chip" data-set="">なし</button><button type="button" class="chip" data-set="today">今日</button><button type="button" class="chip" data-set="week">今週</button><input type="date" aria-label="期限の日付"></div></div>
        <div><div class="picker-label">見込み時間</div>
          <div class="chips est-picker"><button type="button" class="chip" data-set="">なし</button><button type="button" class="chip" data-set="5">5分</button><button type="button" class="chip" data-set="15">15分</button><button type="button" class="chip" data-set="30">30分</button><button type="button" class="chip" data-set="60">60分</button><input type="number" inputmode="numeric" min="1" max="1440" placeholder="分" aria-label="見込み時間(分)"></div></div>
      </div>
    </form>
    <div id="list-dynamic"></div>
  </section>

  <!-- メニュー -->
  <section class="view" id="view-menu" hidden></section>

  <!-- タグでまとめて見る -->
  <section class="view" id="view-tag" hidden></section>

  <!-- リストの編集 -->
  <section class="view" id="view-lists" hidden>
    <h2 class="section-title" style="margin-top:8px">リストを追加</h2>
    <form class="card" id="list-add-form" autocomplete="off">
      <label class="field"><span>名前</span><input id="list-add-name" maxlength="20" placeholder="例: 行きたい場所"></label>
      <div class="list-add">
        <label class="field"><span>種類</span>
          <select id="list-add-kind"><option value="action">実行するリスト</option><option value="stock">ためておくリスト</option></select>
        </label>
        <button class="btn btn-primary" type="submit">追加</button>
      </div>
    </form>
    <div id="lists-dynamic"></div>
    <p class="lists-note">インボックス・今日やる・やることは、アプリの仕組みに使うため削除できません(名前は変えられます)。リストを削除すると、中の項目はインボックスに戻ります。</p>
  </section>

  <!-- 完了済み -->
  <section class="view" id="view-done" hidden></section>

  <!-- 設定 -->
  <section class="view" id="view-settings" hidden>
    <h2 class="section-title" style="margin-top:8px">同期の状態</h2>

<script>
'use strict';

/* =========================================================
 * 定数
 * ======================================================= */
const APP_VERSION = '2.1.0';
const SCHEMA_VERSION = 1;
const DB_NAME = 'nagekomi';
const DB_VERSION = 1;
const API = 'https://api.github.com';
const DEFAULT_SETTINGS = { owner: '', repo: '', branch: 'main', path: 'items.json' };

// リストの初期値。id は項目の list に保存する識別子、name は画面上の名前。
// stock は「ためておくリスト」で、メニューから呼び出したときだけ表示する。
// リストは利用者が追加・変更・削除でき、items.json の lists に保存して同期する(項目と同じく updated_at の新しいほうを採用)
const DEFAULT_LISTS_TIME = '2026-10-15T00:00:00+09:00';
const DEFAULT_LISTS = [
  ['inbox', 'インボックス'], ['today', '今日やる'], ['todo', 'やること'], ['work', '仕事へ転記'],
  ['chores', '家事'], ['shopping', '通販で買う'], ['someday', 'いつかやりたい'],
  ['cards', '買いたいカード', true], ['books', '読みたい本', true], ['movies', '見たい映画', true],
  ['recipes', '作りたいご飯', true], ['places', '行った店', true],
].map(([id, name, stock], i) => ({ id, name, stock: !!stock, order: i, updated_at: DEFAULT_LISTS_TIME, deleted: false }));
// アプリの仕組みに関わるので削除できないリスト(名前の変更はできる)
const FIXED_LISTS = new Set(['inbox', 'today', 'todo']);
const LIST_NAME_MAX = 20;
// 古い順(=後回しにしたものが後ろ)で並べるリスト。それ以外は新しい順。
const QUEUE_LISTS = new Set(['today', 'todo']);

/* =========================================================
 * 状態
 * ======================================================= */
const state = {
  items: new Map(),     // id -> item
  lists: DEFAULT_LISTS.map(l => ({ ...l })),
  pending: {},          // id -> 端末内での変更回数(未送信の印)
  settings: { ...DEFAULT_SETTINGS },
  token: '',
  sync: { lastSyncAt: null, lastError: null },
  syncing: false,
  offline: !navigator.onLine,
};

/* =========================================================
 * 小物
 * ======================================================= */
const $ = sel => document.querySelector(sel);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function activeLists() {
  return state.lists.filter(l => !l.deleted).sort((a, b) => (a.order - b.order) || String(a.id).localeCompare(String(b.id)));
}
function listById(id) {
  return state.lists.find(l => l.id === id && !l.deleted) || null;
}
function listName(id) {
  const l = listById(id);
  return l ? l.name : String(id || '(なし)');
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function parseTime(s) {
  const t = Date.parse(s);
  return Number.isNaN(t) ? 0 : t;
}
// 端末のタイムゾーン付き ISO 8601 文字列(例: 2026-10-15T09:00:00+09:00)
function formatTime(ms) {
  const d = new Date(ms);
  const p = n => String(Math.abs(n)).padStart(2, '0');
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
    `${sign}${p(Math.trunc(off / 60))}:${p(off % 60)}`;
}
// 秒単位で、直前の updated_at(と minMs)より必ず新しい時刻を返す
function nextStamp(prev, minMs = 0) {
  let t = Math.floor(Date.now() / 1000) * 1000;
  const p = Math.max(prev ? parseTime(prev) : 0, minMs);
  if (t <= p) t = Math.floor(p / 1000) * 1000 + 1000;
  return formatTime(t);
}
function firstLine(text) {
  const line = String(text || '').split('\n').find(l => l.trim()) || '';
  return line.trim() || '(本文なし)';
}
function restLines(text) {
  const lines = String(text || '').split('\n');
  const i = lines.findIndex(l => l.trim());
  return i < 0 ? '' : lines.slice(i + 1).join('\n').trim();
}
function displayTime(iso) {
  const t = parseTime(iso);
  if (!t) return '—';
  const d = new Date(t);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
const WEEKDAYS = '日月火水木金土';
const pad2 = n => String(n).padStart(2, '0');
function dateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function todayStr() { return dateStr(new Date()); }
// 「今週」= 今週の日曜日(月曜はじまり)。日曜に押した場合はその日
function weekEndStr() {
  const d = new Date();
  d.setDate(d.getDate() + (7 - d.getDay()) % 7);
  return dateStr(d);
}
function dueDate(it) {
  const m = /^\d{4}-\d{2}-\d{2}/.exec(it && it.due ? String(it.due) : '');
  return m ? m[0] : null;
}
// 期限の表示と色分け。overdue=期限切れ / today=今日まで / week=今週中 / later=それ以降
function dueInfo(it) {
  if (!it.due) return null;
  const d = dueDate(it);
  if (!d) return { cls: 'later', label: '期限 ' + it.due };
  const [y, m, day] = d.split('-').map(Number);
  const md = `${m}/${day}(${WEEKDAYS[new Date(y, m - 1, day).getDay()]})`;
  const today = todayStr();
  if (it.status === 'open' && d < today) return { cls: 'overdue', label: `期限切れ ${md}` };
  if (d === today) return { cls: 'today', label: '今日まで' };
  if (d <= weekEndStr()) return { cls: 'week', label: `${md}まで` };
  return { cls: 'later', label: `${md}まで` };
}
function dueHtml(it) {
  const d = dueInfo(it);
  return d ? `<span class="due-${d.cls}">${esc(d.label)}</span>` : '';
}
function estimateOf(it) {
  const n = Number(it.estimate_min);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function fmtMin(min) {
  const m = Math.round(min);
  return m < 60 ? `${m}分` : `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
}
function fmtClock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${pad2(m)}:${pad2(ss)}`;
}
// 実績(秒)。計測中なら開始からの経過も足す
function elapsedSec(it, now = Date.now()) {
  const base = Math.max(0, Math.floor(Number(it.spent_sec) || 0));
  if (!it.timer_started_at) return base;
  return base + Math.max(0, Math.floor((now - parseTime(it.timer_started_at)) / 1000));
}
function isRunning(it) {
  return !!it.timer_started_at && it.status === 'open' && !it.deleted;
}
// 1件表示で「後回し」にした、期限の迫った項目(その日のあいだだけ優先表示から外す。端末ごと)
function laterToday() {
  try {
    const o = JSON.parse(localStorage.getItem('laterToday') || '{}');
    return new Set(o.date === todayStr() && Array.isArray(o.ids) ? o.ids : []);
  } catch { return new Set(); }
}
function addLaterToday(id) {
  const set = laterToday();
  set.add(id);
  try { localStorage.setItem('laterToday', JSON.stringify({ date: todayStr(), ids: [...set] })); } catch { /* 使えなくても動作は続ける */ }
}
// 入力欄の高さを中身に合わせる(1行から始め、行が増えたら広げる。画面の4割で止めて中でスクロール)
function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.4) + 'px';
}
function parseTags(s) {
  return String(s || '').split(/[,、，]/).map(t => t.trim()).filter(Boolean);
}

/* =========================================================
 * IndexedDB(端末内保存)
 * ======================================================= */
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}
// fn(tx) の中で行った書き込みが確定したら解決する
async function withTx(stores, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(stores, mode);
    let result;
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('保存が中断されました'));
    result = fn(tx);
  });
}
function reqP(req) {
  return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
}
async function loadAll() {
  const db = await openDB();
  const tx = db.transaction(['items', 'meta'], 'readonly');
  const [items, pending, settings, token, sync, lists] = await Promise.all([
    reqP(tx.objectStore('items').getAll()),
    reqP(tx.objectStore('meta').get('pending')),
    reqP(tx.objectStore('meta').get('settings')),
    reqP(tx.objectStore('meta').get('token')),
    reqP(tx.objectStore('meta').get('sync')),
    reqP(tx.objectStore('meta').get('lists')),
  ]);
  if (Array.isArray(lists) && lists.length) state.lists = lists;
  state.items = new Map(items.map(i => [i.id, i]));
  state.pending = pending || {};
  state.settings = { ...DEFAULT_SETTINGS, ...(settings || {}) };
  state.token = token || '';
  state.sync = { lastSyncAt: null, lastError: null, ...(sync || {}) };
}
function putMeta(key, value) {
  return withTx(['meta'], 'readwrite', tx => { tx.objectStore('meta').put(value, key); });
}

/* =========================================================
 * 項目の追加・変更(端末内に保存した時点で完了)
 * ======================================================= */
async function saveLocal(items) {
  // メモリ上の状態を先に更新してから、まとめて IndexedDB に書く
  for (const it of items) {
    state.items.set(it.id, it);
    state.pending[it.id] = (state.pending[it.id] || 0) + 1;
  }
  const pendingCopy = { ...state.pending };
  try {
    await withTx(['items', 'meta'], 'readwrite', tx => {
      const s = tx.objectStore('items');
      for (const it of items) s.put(it);
      tx.objectStore('meta').put(pendingCopy, 'pending');
    });
  } catch (e) {
    showToast('端末への保存に失敗しました: ' + (e && e.message || e));
    throw e;
  } finally {
    render();
  }
  scheduleSync(1500);
}
// extra: { due, estimate_min } を投げ込み時に指定できる
// リストの変更を保存する。項目の付け替え(削除時にインボックスへ戻す)も同じトランザクションで書く
const listKey = id => 'list:' + id;
async function saveLists(lists, items = []) {
  for (const l of lists) {
    const i = state.lists.findIndex(x => x.id === l.id);
    if (i >= 0) state.lists[i] = l; else state.lists.push(l);
    state.pending[listKey(l.id)] = (state.pending[listKey(l.id)] || 0) + 1;
  }
  for (const it of items) {
    state.items.set(it.id, it);
    state.pending[it.id] = (state.pending[it.id] || 0) + 1;
  }
  const listsCopy = state.lists.map(l => ({ ...l }));
  const pendingCopy = { ...state.pending };
  try {
    await withTx(['items', 'meta'], 'readwrite', tx => {
      const s = tx.objectStore('items');
      for (const it of items) s.put(it);
      tx.objectStore('meta').put(listsCopy, 'lists');
      tx.objectStore('meta').put(pendingCopy, 'pending');
    });
  } catch (e) {
    showToast('端末への保存に失敗しました: ' + (e && e.message || e));
    throw e;
  } finally {
    render();
  }
  scheduleSync(1500);
}
function changedList(old, changes) {
  return { ...old, ...changes, updated_at: nextStamp(old.updated_at) };
}
function newItem(text, list = 'inbox', extra = {}) {
  const ts = nextStamp(null);
  return {
    id: uuid(), text, note: '', list, tags: [], status: 'open', due: extra.due || null,
    estimate_min: extra.estimate_min || null, spent_sec: 0, timer_started_at: null, done_at: null,
    created_at: ts, updated_at: ts, deleted: false,
  };
}
async function addItem(text, list = 'inbox', extra = {}) {
  const t = String(text || '').replace(/\r\n?/g, '\n').trim();
  if (!t) return null;
  const it = newItem(t, list, extra);
  await saveLocal([it]);
  return it;
}
// 「1行ずつ別の項目にする」で使う。行頭の箇条書きの印(・ - * • □ 1. など)は取り除く
function splitLines(text) {
  return String(text || '').replace(/\r\n?/g, '\n').split('\n')
    .map(l => l.replace(/^\s*(?:[・•●○◦▪︎■□☐☑✓✔]\s*|[-*+]\s+|\d{1,3}[.)．）](?!\d)\s*)/, '').trim())
    .filter(Boolean);
}
// 複数件をまとめて追加する。並び順を保つため、1件目がいちばん古くなるよう1秒ずつずらす
async function addItems(texts, list = 'inbox', extra = {}) {
  const now = Math.floor(Date.now() / 1000) * 1000;
  const items = texts.map((t, i) => {
    const it = newItem(t, list, extra);
    it.created_at = it.updated_at = formatTime(now - (texts.length - 1 - i) * 1000);
    return it;
  });
  if (items.length) await saveLocal(items);
  return items;
}
function changed(old, changes, minMs = 0) {
  return { ...old, ...changes, updated_at: nextStamp(old.updated_at, minMs) };
}
async function updateItem(id, changes, minMs = 0) {
  const old = state.items.get(id);
  if (!old) return null;
  const it = changed(old, changes, minMs);
  await saveLocal([it]);
  return it;
}
// 計測中なら止めて、経過時間を spent_sec に足し込む変更内容を返す
function pauseChanges(it, now = Date.now()) {
  return it.timer_started_at ? { spent_sec: elapsedSec(it, now), timer_started_at: null } : {};
}

/* =========================================================
 * 表示用の抽出
 * ======================================================= */
function visibleItems() {
  return [...state.items.values()].filter(i => !i.deleted);
}
function openItemsOf(list) {
  const arr = visibleItems().filter(i => i.status === 'open' && i.list === list);
  if (QUEUE_LISTS.has(list)) arr.sort((a, b) => parseTime(a.updated_at) - parseTime(b.updated_at) || String(a.created_at).localeCompare(String(b.created_at)));
  else arr.sort((a, b) => parseTime(b.created_at) - parseTime(a.created_at));
  return arr;
}
// 1件表示の順番: 計測中 → 期限切れ・今日まで(どのリストでも) → 今日やる(+後回しにした期限の迫った項目) → やること
function focusQueue() {
  const f = focusFilter();
  return f ? filteredQueue(f) : normalQueue();
}
// 絞り込み(「この条件で1件ずつ片付ける」)。条件と、後回しにした順を端末に保存する
function focusFilter() {
  try {
    const o = JSON.parse(localStorage.getItem('focusFilter') || 'null');
    return o && o.cond ? { cond: { ...DEFAULT_SEARCH, ...o.cond }, skipped: Array.isArray(o.skipped) ? o.skipped : [] } : null;
  } catch { return null; }
}
function setFocusFilter(o) {
  try { if (o) localStorage.setItem('focusFilter', JSON.stringify(o)); else localStorage.removeItem('focusFilter'); } catch { /* 保存できなくても続ける */ }
}
// 計測中 → 条件に当てはまる項目(条件で探すと同じ並び) → 後回しにした項目(後回しにした順)
function filteredQueue(f) {
  const running = visibleItems().filter(isRunning);
  const results = searchItems(f.cond);
  const hit = new Set(results.map(i => i.id));
  const fresh = results.filter(i => !f.skipped.includes(i.id));
  const back = f.skipped.filter(id => hit.has(id)).map(id => state.items.get(id));
  return [...running, ...fresh, ...back];
}
function condSummary(c) {
  return [c.min ? `${c.min}分以内` : '', ...c.tags, c.includeStock ? 'ためておくも含む' : ''].filter(Boolean).join('・');
}
function normalQueue() {
  const open = visibleItems().filter(i => i.status === 'open');
  const today = todayStr();
  const skipped = laterToday();
  const byUpdated = (a, b) => parseTime(a.updated_at) - parseTime(b.updated_at) || String(a.created_at).localeCompare(String(b.created_at));
  const urgentDue = i => { const d = dueDate(i); return !!d && d <= today; };
  const running = open.filter(isRunning).sort(byUpdated);
  const urgent = open.filter(i => !isRunning(i) && urgentDue(i) && !skipped.has(i.id))
    .sort((a, b) => dueDate(a).localeCompare(dueDate(b)) || byUpdated(a, b));
  const seen = new Set([...running, ...urgent].map(i => i.id));
  const todo = openItemsOf('todo').filter(i => !seen.has(i.id));
  for (const i of todo) seen.add(i.id);
  // 後回しにした期限の迫った項目は、今日やると同じ列に入れて updated_at の順に回す
  const rotation = open.filter(i => !seen.has(i.id) && (i.list === 'today' || urgentDue(i))).sort(byUpdated);
  return [...running, ...urgent, ...rotation, ...todo];
}
// 条件で探す: 見込み時間(min 分以内)・タグ(どれかが付いている)・ためておくリストを含めるか、で絞り込む。
// 「仕事へ転記」と計測中の項目は除く。並びは 期限の近い順 → (時間指定ありなら)時間を使い切れる順 / (なしなら)短い順
const LIST_RANK = ['today', 'todo', 'chores', 'shopping', 'someday', 'inbox'];
function searchItems(cond) {
  const rank = i => { const d = dueInfo(i); return d ? { overdue: 0, today: 1, week: 2, later: 3 }[d.cls] : 4; };
  const lr = i => { const r = LIST_RANK.indexOf(i.list); return r < 0 ? LIST_RANK.length : r; };
  const stockIds = new Set(activeLists().filter(l => l.stock).map(l => l.id));
  const tags = cond.tags || [];
  const byEst = cond.min ? (a, b) => estimateOf(b) - estimateOf(a) : (a, b) => (estimateOf(a) || 9999) - (estimateOf(b) || 9999);
  return visibleItems()
    .filter(i => i.status === 'open' && !isRunning(i) && i.list !== 'work')
    .filter(i => cond.includeStock || !stockIds.has(i.list))
    .filter(i => !cond.min || (estimateOf(i) && estimateOf(i) <= cond.min))
    .filter(i => !tags.length || (Array.isArray(i.tags) && i.tags.some(t => tags.includes(t))))
    .sort((a, b) => rank(a) - rank(b) || byEst(a, b) || lr(a) - lr(b) || parseTime(a.created_at) - parseTime(b.created_at));
}
function closedItems() {
  return visibleItems().filter(i => i.status !== 'open')
    .sort((a, b) => parseTime(b.updated_at) - parseTime(a.updated_at));
}
function unknownListIds() {
  const ids = new Set();
  for (const i of visibleItems()) if (i.status === 'open' && !listById(i.list)) ids.add(i.list);
  return [...ids];
}

function tagCounts() {

  for (const i of visibleItems()) {
    if (i.status !== 'open') continue;
    for (const t of new Set(Array.isArray(i.tags) ? i.tags : [])) m.set(t, (m.get(t) || 0) + 1);

// タグの候補(編集画面)。よく使うものだけを少し出し、打ち始めたら絞り込む(長い一覧にしないため)
const TAG_PICKER_TOP = 8;
let tagPickerAll = false;
function allTagUsage() {
  // [タグ, 未完了の件数, 全体の件数]。未完了で多く使うものほど前に出す(完了済みだけのタグも候補に残す)
  const m = new Map();
  for (const i of visibleItems()) {
    for (const t of new Set(Array.isArray(i.tags) ? i.tags : [])) {
      const c = m.get(t) || [0, 0];

      m.set(t, c);
    }
  }
  return [...m.entries()].map(([t, [open, all]]) => [t, open, all])
    .sort((a, b) => b[1] - a[1] || b[2] - a[2] || a[0].localeCompare(b[0], 'ja'));
}
// ひらがな・カタカナ、大文字・小文字、全角・半角の違いを無視して比べる
function foldKana(s) {

}
function renderTagPicker() {
  const input = $('#edit-tags'), box = $('#edit-tag-picker');
  if (!input || !box) return;
  const raw = input.value;
  const frag = tagFragment(raw);
  const tags = parseTags(raw);
  const chosen = frag ? tags.slice(0, -1) : tags; // 打ちかけの語はまだ選んだことにしない
  const usage = allTagUsage();
  const count = t => (usage.find(([x]) => x === t) || [, 0])[1];
  const chip = (t, on, cls = '') => `<button type="button" class="chip${on ? ' on' : ''}${cls}" data-tag="${esc(t)}" aria-pressed="${on}">${on ? '✓ ' : ''}${esc(t)}${count(t) ? ` <small>${count(t)}</small>` : ''}</button>`;
  let html = chosen.map(t => chip(t, true)).join('');
  if (frag) {
    const f = foldKana(frag);
    const hits = usage.map(([t]) => t).filter(t => !chosen.includes(t) && foldKana(t).includes(f));
    html += hits.slice(0, TAG_PICKER_TOP).map(t => chip(t, false, ' add')).join('');
    if (!hits.some(t => t === frag)) html += `<span class="tag-new">「${esc(frag)}」は新しいタグになります</span>`;
  } else {
    const rest = usage.map(([t]) => t).filter(t => !chosen.includes(t));
    const shown = tagPickerAll ? rest : rest.slice(0, TAG_PICKER_TOP);
    html += shown.map(t => chip(t, false, ' add')).join('');
    if (rest.length > TAG_PICKER_TOP) html += `<button type="button" class="opts-btn" data-tag-more>${tagPickerAll ? '少なく表示 ▴' : `ほか ${rest.length - TAG_PICKER_TOP} 件 ▾`}</button>`;
    if (!usage.length) html += '<span class="tag-new">まだタグはありません</span>';

        <span class="nm">${esc(l.name)}<small>${open.filter(x => x.list === l.id).length} 件</small></span>
        <button type="button" class="mini-btn" data-action="list-up" aria-label="上へ"${i === 0 ? ' disabled' : ''}>↑</button>
        <button type="button" class="mini-btn" data-action="list-down" aria-label="下へ"${i === ls.length - 1 ? ' disabled' : ''}>↓</button>
        <button type="button" class="mini-btn" data-action="list-edit">編集</button>
      </li>`).join('');
    return `<h2 class="section-title">${title}</h2>${rows ? `<ul class="menu-list">${rows}</ul>` : '<p class="empty">ありません</p>'}`;
  };
  $('#lists-dynamic').innerHTML = group(false, '実行するリスト') + group(true, 'ためておくリスト');
}

function validListName(name, exceptId) {
  const n = String(name || '').trim();
  if (!n) return { error: '名前を入力してください' };
  if (n.length > LIST_NAME_MAX) return { error: `名前は${LIST_NAME_MAX}文字までです` };
  if (activeLists().some(l => l.id !== exceptId && l.name === n)) return { error: `「${n}」はすでにあります` };
  return { name: n };
}
async function addList(name, stock) {
  const v = validListName(name);
  if (v.error) { showToast(v.error); return null; }
  const order = Math.max(-1, ...state.lists.map(l => Number(l.order) || 0)) + 1;
  const l = { id: 'l-' + uuid().slice(0, 8), name: v.name, stock: !!stock, order, updated_at: nextStamp(null), deleted: false };
  await saveLists([l]);
  showToast(`「${v.name}」を追加しました`);
  return l;
}
async function moveList(id, dir) {
  const cur = listById(id);
  if (!cur) return;
  const siblings = activeLists().filter(l => l.stock === cur.stock);
  const i = siblings.findIndex(l => l.id === id);
  const other = siblings[i + dir];
  if (!other) return;
  await saveLists([changedList(cur, { order: other.order }), changedList(other, { order: cur.order })]);
}
let editingList = null;
function openListEditor(id) {
  const l = listById(id);
  if (!l) return;
  editingList = id;
  const fixed = FIXED_LISTS.has(id);
  $('#list-name').value = l.name;
  $('#list-kind').value = l.stock ? 'stock' : 'action';
  $('#list-kind').disabled = fixed;
  $('#list-kind-note').textContent = fixed ? 'このリストはアプリの仕組みに使うため、種類の変更と削除はできません。' : '';
  $('#list-delete').hidden = fixed;
  const dlg = $('#list-dialog');
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
}
function closeListEditor() {
  editingList = null;
  const dlg = $('#list-dialog');
  if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
}
async function saveListEditor() {
  const l = editingList && listById(editingList);
  if (!l) return closeListEditor();
  const v = validListName($('#list-name').value, l.id);
  if (v.error) { showToast(v.error); return; }
  const stock = FIXED_LISTS.has(l.id) ? l.stock : $('#list-kind').value === 'stock';
  closeListEditor();
  if (v.name === l.name && stock === l.stock) return;
  await saveLists([changedList(l, { name: v.name, stock })]);

}
async function deleteList(id) {
  const l = listById(id);
  if (!l || FIXED_LISTS.has(id)) return;
  const inside = visibleItems().filter(i => i.list === id);
  const openN = inside.filter(i => i.status === 'open').length;
  if (!confirm(`「${l.name}」を削除しますか?` + (inside.length ? `\n中の項目(未完了 ${openN} 件)はインボックスに戻ります。` : ''))) return;
  closeListEditor();
  await saveLists([changedList(l, { deleted: true })], inside.map(i => changed(i, { list: 'inbox' })));
  showToast(`「${l.name}」を削除しました` + (openN ? `(${openN} 件をインボックスへ)` : ''));
  if (route.view === 'list' && route.arg === id) location.replace('#/lists');
}

function renderDone() {

function syncSummary() {
  const n = Object.keys(state.pending).length;
  if (!syncConfigured()) return { key: 'local', label: '端末内のみ', detail: 'GitHub との同期は設定されていません。データはこの端末の中だけに保存されています。' };
  if (state.syncing) return { key: 'syncing', label: '同期中', detail: '同期しています…' };
  if (state.sync.lastError) return { key: 'error', label: 'エラー', detail: state.sync.lastError };
  if (n > 0) return { key: state.offline ? 'offline' : 'pending', label: `未送信 ${n}`, detail: `未送信の変更が ${n} 件あります。${state.offline ? '通信できるようになったら自動で送信します。' : 'まもなく送信します。'}` };
  return { key: 'synced', label: '同期済み', detail: '同期済みです。' };
}

/* =========================================================
 * 画面の切り替え(URL の # で管理)
 * ======================================================= */
let inAppNavs = 0;
const TABS = new Set(['home', 'focus', 'overview']);
const TAB_HASH = { home: '#/', focus: '#/focus', overview: '#/overview' };
let lastTab = 'home';
function parseRoute() {
  const parts = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean);
  const view = parts[0] || 'home';
  if (view === 'list' && parts[1]) return { view: 'list', arg: decodeURIComponent(parts[1]) };
  if (view === 'tag' && parts[1]) return { view: 'tag', arg: decodeURIComponent(parts.slice(1).join('/')) };
  if (['menu', 'done', 'settings', 'lists', 'focus', 'overview'].includes(view)) return { view, arg: null };
  return { view: 'home', arg: null };
}
function applyRoute() {
  const prev = route;
  route = parseRoute();
  for (const v of ['home', 'focus', 'overview', 'list', 'menu', 'done', 'settings', 'lists', 'tag']) $('#view-' + v).hidden = v !== route.view;
  const titles = { home: '投げ込み', focus: '1件表示', overview: 'リスト', menu: 'メニュー', done: '完了済み', settings: '設定・同期', lists: 'リストの追加・編集' };
  $('#title').textContent = route.view === 'list' ? listName(route.arg) : route.view === 'tag' ? `タグ: ${route.arg}` : titles[route.view];
  const nav = $('#nav-btn');
  if (TABS.has(route.view)) {
    lastTab = route.view;
    nav.textContent = '☰'; nav.setAttribute('aria-label', 'メニュー');
  } else { nav.textContent = '‹'; nav.setAttribute('aria-label', '戻る'); }
  for (const a of document.querySelectorAll('#tabbar a')) a.classList.toggle('on', a.dataset.tab === route.view);
  if (route.view === 'settings' && prev.view !== 'settings') fillSettingsForm();
  if (route.view === 'list' && (prev.view !== 'list' || prev.arg !== route.arg)) {
    $('#list-capture-text').value = '';
    $('#list-capture-btn').disabled = true;
    $('#list-capture-btn').textContent = '追加';
  }
  render();
  window.scrollTo(0, 0);
}
function go(hash) {
  if (location.hash === hash) return;
  inAppNavs++;
  location.hash = hash;
}
function goBack() {
  if (inAppNavs > 0) { inAppNavs--; history.back(); }
  else location.replace(TAB_HASH[lastTab]);
}

/* =========================================================
 * 期限・見込み時間の選択ボタン(chips の中の input に値を入れる)
 * ======================================================= */
function chipValue(v) {
  return v === 'today' ? todayStr() : v === 'week' ? weekEndStr() : v;
}
function syncChips(root) {
  const v = root.querySelector('input').value;
  for (const b of root.querySelectorAll('[data-set]')) b.classList.toggle('on', chipValue(b.dataset.set) === v);
}
function setupPickers() {
  for (const root of document.querySelectorAll('.due-picker, .est-picker')) {
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-set]');
      if (!b) return;
      const input = root.querySelector('input');
      input.value = chipValue(b.dataset.set);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
    root.addEventListener('input', () => syncChips(root));
    root.addEventListener('change', () => syncChips(root));
    syncChips(root);
  }
}
function parseEstimate(v) {
  const n = Math.round(Number(v));
  return v !== '' && Number.isFinite(n) && n > 0 ? Math.min(n, 1440) : null;
}

/* =========================================================
 * 編集ダイアログ
 * ======================================================= */
let editing = null; // { id, initial: {...} }
function openEditor(id) {
  const it = state.items.get(id);
  if (!it) return;
  const sel = $('#edit-list');
  const opts = activeLists().map(l => `<option value="${esc(l.id)}">${esc(l.name)}${l.stock ? '(ためておく)' : ''}</option>`);
  if (!listById(it.list)) opts.push(`<option value="${esc(it.list)}">${esc(it.list)}</option>`);
  sel.innerHTML = opts.join('');
  const initial = {
    text: it.text || '',
    note: it.note || '',
    list: it.list,
    due: it.due ? String(it.due).slice(0, 10) : '',
    est: estimateOf(it) ? String(estimateOf(it)) : '',
    tags: (Array.isArray(it.tags) ? it.tags : []).map(t => t + '、').join(''), // 末尾の読点で、続けて打てる・候補が選択済みとして出る
  };
  $('#edit-text').value = initial.text;
  $('#edit-note').value = initial.note;
  sel.value = initial.list;
  $('#edit-due').value = initial.due;
  $('#edit-est').value = initial.est;
  for (const root of $('#edit-dialog').querySelectorAll('.due-picker, .est-picker')) syncChips(root);
  $('#edit-tags').value = initial.tags;
  $('#edit-toggle-done').textContent = it.status === 'open' ? '完了にする' : '未完了に戻す';
  const spent = elapsedSec(it);
  $('#edit-info').innerHTML = [
    spent > 0 ? `実績: ${esc(fmtSpent(spent))}${isRunning(it) ? '(計測中)' : ''}` : '',
    it.done_at ? `完了: ${esc(displayTime(it.done_at))}` : '',
    `作成: ${esc(displayTime(it.created_at))}`,
    `更新: ${esc(displayTime(it.updated_at))}`,
  ].filter(Boolean).join('<br>');
  editing = { id, initial };
  tagPickerAll = false;
  renderTagPicker();
  const dlg = $('#edit-dialog');
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  for (const ta of dlg.querySelectorAll('textarea.grow')) { autoGrow(ta); ta.scrollTop = 0; }
}
function closeEditor() {
  editing = null;
  const dlg = $('#edit-dialog');
  if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
}
// 利用者が変えた欄だけを取り出す(同期で裏から届いた変更を上書きしないため)
function collectEdits() {
  const { initial } = editing;
  const cur = {
    text: $('#edit-text').value.replace(/\r\n?/g, '\n'),
    note: $('#edit-note').value.replace(/\r\n?/g, '\n'),
    list: $('#edit-list').value,
    due: $('#edit-due').value,
    est: $('#edit-est').value,
    tags: $('#edit-tags').value,
  };
  const ch = {};
  if (cur.text !== initial.text) ch.text = cur.text.trim();
  if (cur.note !== initial.note) ch.note = cur.note;
  if (cur.list !== initial.list) ch.list = cur.list;
  if (cur.due !== initial.due) ch.due = cur.due || null;
  if (cur.est !== initial.est) ch.estimate_min = parseEstimate(cur.est);
  if (parseTags(cur.tags).join('\n') !== parseTags(initial.tags).join('\n')) ch.tags = parseTags(cur.tags);
  return ch;
}
async function saveEditor() {
  if (!editing) return;
  const ch = collectEdits();
  if ('text' in ch && !ch.text) { showToast('本文を入力してください'); return; }
  const id = editing.id;
  closeEditor();
  if (Object.keys(ch).length) {
    await updateItem(id, ch);
    showToast('保存しました');
  }
}

/* =========================================================
 * トースト
 * ======================================================= */
let toastTimer = null;
function showToast(msg, action) {
  const el = $('#toast');
  $('#toast-msg').textContent = msg;
  const btn = $('#toast-action');
  if (action) {
    btn.hidden = false;
    btn.textContent = action.label;
    btn.onclick = () => { el.hidden = true; action.fn(); };
  } else {
    btn.hidden = true;
    btn.onclick = null;
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 5000 : 2500);
}

/* =========================================================
 * 操作
 * ======================================================= */
async function markDone(id) {
  const prev = state.items.get(id);
  if (!prev) return;
  const now = Date.now();
  const it = await updateItem(id, { status: 'done', done_at: formatTime(now), ...pauseChanges(prev, now) });
  const spent = elapsedSec(it), est = estimateOf(it);
  const msg = spent > 0 ? `完了: 実際 ${fmtSpent(spent)}${est ? ` / 目安 ${fmtMin(est)}` : ''}` : '完了にしました';
  showToast(msg, { label: '元に戻す', fn: () => updateItem(id, { status: 'open', done_at: null }) });
}
async function reopen(id) {
  await updateItem(id, { status: 'open', done_at: null });
  showToast('未完了に戻しました');
}
async function later(id) {
  // 項目の中身は変えず、updated_at を同じリストのどの項目よりも新しくして、表示順の最後へ回す。計測中なら一時停止する
  const it = state.items.get(id);
  if (!it) return;
  const f = focusFilter();
  if (f) {
    // 絞り込み中は、条件の中での順番を後ろへ回すだけ(データは書き換えない。計測中なら一時停止)
    setFocusFilter({ ...f, skipped: [...f.skipped.filter(x => x !== id), id] });
    if (it.timer_started_at) await updateItem(id, pauseChanges(it)); else render();
    showToast(it.timer_started_at ? '一時停止して後回しにしました' : '後回しにしました');
    return;
  }
  const d = dueDate(it);
  if (d && d <= todayStr()) addLaterToday(id);
  const peers = [...openItemsOf(it.list), ...focusQueue()].filter(i => i.id !== id);
  const latest = Math.max(0, ...peers.map(i => parseTime(i.updated_at)));
  await updateItem(id, pauseChanges(it), latest);
  showToast(it.timer_started_at ? '一時停止して後回しにしました' : '後回しにしました');
}
// 計測は同時に1件だけ。ほかに計測中の項目があれば一時停止してから始める
async function startTimer(id) {
  const it = state.items.get(id);
  if (!it || it.status !== 'open' || isRunning(it)) return;
  const now = Date.now();
  const others = [...state.items.values()].filter(o => o.id !== id && isRunning(o)).map(o => changed(o, pauseChanges(o, now)));
  await saveLocal([...others, changed(it, { timer_started_at: formatTime(now) })]);
  showToast(others.length ? '計測を切り替えました' : '計測を始めました');
  if (route.view === 'focus') { const card = $('.focus-card'); if (card) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
async function pauseTimer(id) {
  const it = state.items.get(id);
  if (!it || !it.timer_started_at) return;
  await updateItem(id, pauseChanges(it));
  showToast('一時停止しました');
}
async function removeItem(id) {
  if (!confirm('この項目を削除しますか?')) return;
  closeEditor();
  await updateItem(id, { deleted: true });
  showToast('削除しました', { label: '元に戻す', fn: () => updateItem(id, { deleted: false }) });
}

function bindEvents() {
  // 投げ込み欄(ホームとリスト画面の2か所)
  let split = false;
  try { split = localStorage.getItem('splitLines') === '1'; } catch { /* 使えなくても既定値で動く */ }
  setupPickers();
  const forms = [
    { form: $('#capture-form'), ta: $('#capture-text'), btn: $('#capture-btn'), list: () => 'inbox' },
    { form: $('#list-capture-form'), ta: $('#list-capture-text'), btn: $('#list-capture-btn'), list: () => route.view === 'list' ? route.arg : null },
  ];
  // 期限・見込み時間(投げ込み時に任意で指定)
  const optsOf = f => ({
    panel: f.form.querySelector('.capture-opts'),
    toggle: f.form.querySelector('.opts-btn'),
    due: f.form.querySelector('.due-picker input'),
    est: f.form.querySelector('.est-picker input'),
  });
  const extraOf = f => {
    const o = optsOf(f);
    return { due: o.due.value || null, estimate_min: parseEstimate(o.est.value) };
  };
  const optsLabel = f => {
    const o = optsOf(f), x = extraOf(f);
    const parts = [];
    if (x.due) parts.push(dueInfo({ due: x.due, status: 'open' }).label);
    if (x.estimate_min) parts.push(fmtMin(x.estimate_min));
    o.toggle.textContent = (parts.length ? parts.join('・') : '期限・見込み') + (o.panel.hidden ? ' ▾' : ' ▴');
  };
  const resetOpts = f => {
    const o = optsOf(f);
    o.due.value = ''; o.est.value = ''; o.panel.hidden = true;
    for (const root of f.form.querySelectorAll('.due-picker, .est-picker')) syncChips(root);
    optsLabel(f);
  };
  for (const f of forms) {
    const o = optsOf(f);
    o.toggle.addEventListener('click', () => { o.panel.hidden = !o.panel.hidden; optsLabel(f); });
    o.panel.addEventListener('input', () => optsLabel(f));
    o.panel.addEventListener('click', () => setTimeout(() => optsLabel(f)));
  }
  const refresh = f => {
    const n = split ? splitLines(f.ta.value).length : (f.ta.value.trim() ? 1 : 0);
    f.btn.disabled = n === 0;
    f.btn.textContent = n > 1 ? `${n}件追加` : '追加';
  };
  for (const f of forms) {
    const check = f.form.querySelector('.split-check');
    check.checked = split;
    check.addEventListener('change', () => {
      split = check.checked;
      try { localStorage.setItem('splitLines', split ? '1' : '0'); } catch { /* 保存できなくても動作には影響しない */ }
      for (const g of forms) { g.form.querySelector('.split-check').checked = split; refresh(g); }
    });
    f.ta.addEventListener('input', () => { refresh(f); autoGrow(f.ta); });
    f.form.addEventListener('submit', async e => {
      e.preventDefault();
      const list = f.list();
      const text = f.ta.value;
      const texts = split ? splitLines(text) : (text.trim() ? [text] : []);
      if (!list || !texts.length) return;
      f.ta.value = ''; refresh(f); autoGrow(f.ta);
      const extra = extraOf(f);
      try {
        if (texts.length > 1) await addItems(texts, list, extra); else await addItem(texts[0], list, extra);
        resetOpts(f);
        showToast(`${list === 'inbox' ? 'インボックス' : '「' + listName(list) + '」'}に${texts.length > 1 ? ` ${texts.length} 件を` : ''}追加しました`);
      } catch { f.ta.value = text; refresh(f); }
      if (list === 'inbox') f.ta.focus();
    });
    // PC では Ctrl/⌘ + Enter で追加(スマホの Enter は改行・変換確定に使う)
    f.ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); f.form.requestSubmit(); }
    });
  }

  // 画面内のボタン(委譲)
  document.addEventListener('click', e => {
    const nav = e.target.closest('a[data-nav]');
    if (nav) { e.preventDefault(); go(nav.getAttribute('href')); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const holder = btn.closest('[data-id]');
    const id = holder && holder.dataset.id;
    switch (btn.dataset.action) {
      case 'done': if (id) markDone(id); break;
      case 'reopen': if (id) reopen(id); break;
      case 'later': if (id) later(id); break;
      case 'start': if (id) startTimer(id); break;
      case 'pause': if (id) pauseTimer(id); break;
      case 'toggle-search': searchOpen = !searchOpen; searchShowAll = false; render(); break;
      case 'search-min': searchCond = { ...searchCond, min: Number(btn.dataset.min) || null }; saveSearch(searchCond); searchShowAll = false; render(); break;

    state.settings = settings;

/* =========================================================
 * GitHub との同期
 * ======================================================= */
class SyncError extends Error {}
class ConflictError extends Error {}

function syncConfigured() {
  return !!(state.token && state.settings.owner && state.settings.repo);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function repoPath() {
  const { owner, repo } = state.settings;
  return `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
}
function contentsPath() {
  return repoPath() + '/contents/' + state.settings.path.split('/').map(encodeURIComponent).join('/');
}
async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch(API + path, {
      ...opts,
      cache: 'no-store',
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: 'Bearer ' + state.token,
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
    });
  } catch (e) {
    const err = new SyncError('通信できませんでした');
    err.network = true;
    throw err;
  }
  return res;
}
async function errorFrom(res, what) {
  let msg = '';
  try { msg = (await res.json()).message || ''; } catch { /* 本文なし */ }
  if (res.status === 401) return new SyncError('アクセストークンが無効か、期限切れです。設定画面で入れ直してください。');
  if (res.status === 403 && /rate limit/i.test(msg)) return new SyncError('GitHub の利用回数の上限に達しました。しばらく待ってから再度お試しください。');
  if (res.status === 403) return new SyncError('アクセストークンに、データ用リポジトリへの書き込み権限(Contents: Read and write)がありません。');
  if (res.status === 404) return new SyncError('リポジトリが見つかりません。持ち主・名前・ブランチを確認し、トークンがそのリポジトリを対象にしているか確認してください。');
  return new SyncError(`${what}に失敗しました(${res.status}${msg ? ': ' + msg : ''})`);
}
// 1. GitHub から最新の items.json を取得する
async function fetchRemote() {
  const ref = encodeURIComponent(state.settings.branch);
  const res = await gh(`${contentsPath()}?ref=${ref}`);
  if (res.status === 404) {
    // ファイルが無いのか、リポジトリ自体に届かないのかを確かめる
    const repoRes = await gh(repoPath());
    if (!repoRes.ok) throw await errorFrom(repoRes, 'リポジトリの確認');
    return { sha: null, doc: migrate({ schema_version: SCHEMA_VERSION, items: [] }) };
  }
  if (!res.ok) throw await errorFrom(res, 'データの取得');
  const meta = await res.json();
  if (Array.isArray(meta) || meta.type !== 'file') throw new SyncError(`「${state.settings.path}」はファイルではありません。設定のファイル名を確認してください。`);
  let b64 = meta.content;
  if (meta.encoding !== 'base64' || !b64) {
    // 1MB を超えるファイルは内容が省かれるため、blob として取り直す
    const bres = await gh(`${repoPath()}/git/blobs/${meta.sha}`);
    if (!bres.ok) throw await errorFrom(bres, 'データの取得');
    b64 = (await bres.json()).content;
  }
  let doc;
  try { doc = JSON.parse(base64ToUtf8(b64) || '{}'); }
  catch { throw new SyncError(`GitHub 上の「${state.settings.path}」が JSON として読めません。手で編集した場合は書式を確認してください。`); }
  return { sha: meta.sha, doc: migrate(doc) };
}
// データの形を変えたときは、ここに古い形から新しい形への変換を追加する
function migrate(doc) {
  if (!doc || typeof doc !== 'object') throw new SyncError('GitHub 上のデータの形式が正しくありません。');
  const v = doc.schema_version ?? 1;
  if (v > SCHEMA_VERSION) throw new SyncError(`GitHub 上のデータは新しい形式(${v})です。アプリを最新版に更新してください。`);
  if (!Array.isArray(doc.items)) {
    if (doc.items === undefined) doc.items = [];
    else throw new SyncError('GitHub 上のデータに items の一覧がありません。');
  }
  doc.items = doc.items.filter(i => i && typeof i === 'object' && typeof i.id === 'string' && i.id);
  // lists は後から加えた欄。無ければ「初期のリストのまま」とみなす(利用者がリストを変えたときに初めて書き込む)
  if (doc.lists !== undefined && !Array.isArray(doc.lists)) throw new SyncError('GitHub 上のデータの lists が正しくありません。');
  doc.lists = doc.lists === undefined
    ? DEFAULT_LISTS.map(l => ({ ...l }))
    : doc.lists.filter(l => l && typeof l === 'object' && typeof l.id === 'string' && l.id && typeof l.name === 'string');
  doc.schema_version = SCHEMA_VERSION;
  return doc;
}
// 2〜4. 項目ごと(id 単位)に突き合わせ、updated_at が新しいほうを採用。片方にしかない項目は残す
function mergeItems(localArr, remoteArr) {
  const merged = new Map();
  for (const r of remoteArr) merged.set(r.id, r);
  let toRemote = 0;
  for (const l of localArr) {
    const r = merged.get(l.id);
    if (!r || parseTime(l.updated_at) > parseTime(r.updated_at)) { merged.set(l.id, l); toRemote++; }
  }
  return { merged: [...merged.values()], toRemote };
}
// 5. 統合結果を GitHub に書き込む
async function putRemote(doc, items, lists, sha, changed) {
  const sorted = [...items].sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)) || a.id.localeCompare(b.id));
  const sortedLists = [...lists].sort((a, b) => (a.order - b.order) || a.id.localeCompare(b.id));
  const out = { ...doc, schema_version: SCHEMA_VERSION, lists: sortedLists, items: sorted };
  const body = {
    message: sha ? `アプリから同期: ${changed} 件の変更` : `アプリから同期: ${state.settings.path} を作成`,
    content: utf8ToBase64(JSON.stringify(out, null, 2) + '\n'),
    branch: state.settings.branch,
  };
  if (sha) body.sha = sha;
  const res = await gh(contentsPath(), { method: 'PUT', body: JSON.stringify(body) });
  if (res.status === 409) throw new ConflictError('conflict');
  if (res.status === 422) {
    let msg = '';
    try { msg = (await res.clone().json()).message || ''; } catch { /* 本文なし */ }
    if (/sha/i.test(msg)) throw new ConflictError('conflict');
  }
  if (!res.ok) throw await errorFrom(res, 'データの書き込み');
}
// 統合結果を端末内に反映する。同期中に端末で変更された項目は、より新しいので残す
async function applyMerged(merged, mergedLists, pendingSnap) {
  const toWrite = [];
  for (const it of merged) {
    const cur = state.items.get(it.id);
    if (!cur || parseTime(it.updated_at) > parseTime(cur.updated_at)) toWrite.push(it);
  }
  for (const it of toWrite) state.items.set(it.id, it);
  let listsChanged = false;
  for (const l of mergedLists) {
    const i = state.lists.findIndex(x => x.id === l.id);
    if (i < 0) { state.lists.push(l); listsChanged = true; }
    else if (parseTime(l.updated_at) > parseTime(state.lists[i].updated_at)) { state.lists[i] = l; listsChanged = true; }
  }
  const listsCopy = state.lists.map(l => ({ ...l }));
  for (const [id, rev] of Object.entries(pendingSnap)) {
    if (state.pending[id] === rev) delete state.pending[id];
  }
  const pendingCopy = { ...state.pending };
  await withTx(['items', 'meta'], 'readwrite', tx => {
    const s = tx.objectStore('items');
    for (const it of toWrite) s.put(it);
    if (listsChanged) tx.objectStore('meta').put(listsCopy, 'lists');
    tx.objectStore('meta').put(pendingCopy, 'pending');
  });
}
async function syncOnce() {
  for (let attempt = 0; attempt < 5; attempt++) {
    const pendingSnap = { ...state.pending };
    const remote = await fetchRemote();
    const { merged, toRemote } = mergeItems([...state.items.values()], remote.doc.items);
    const lists = mergeItems(state.lists, remote.doc.lists);
    const changed = toRemote + lists.toRemote;
    if (changed > 0 || !remote.sha) {
      try {
        await putRemote(remote.doc, merged, lists.merged, remote.sha, changed);
      } catch (e) {
        if (e instanceof ConflictError) continue; // 書き込みの競合: 1 からやり直す
        throw e;
      }
    }
    await applyMerged(merged, lists.merged, pendingSnap);
    return;
  }
  throw new SyncError('書き込みの競合が続いたため、同期できませんでした。しばらくしてから再度お試しください。');
}

let syncTimer = null;
let syncAgain = false;
function scheduleSync(delay = 1500) {
  if (!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(false), delay);
}
async function syncNow(manual) {
  if (!syncConfigured()) return;
  if (state.syncing) { syncAgain = true; return; }
  if (!navigator.onLine) {
    state.offline = true; render();
    if (manual) showToast('オフラインです。通信できるようになったら自動で同期します。');
    return;
  }
  state.syncing = true;
  syncAgain = false;
  render();
  try {
    await syncOnce();
    state.offline = false;
    state.sync = { lastSyncAt: formatTime(Date.now()), lastError: null };
    if (manual) showToast('同期しました');
  } catch (e) {
    if (e && e.network) {
      // 通信できないだけならエラーにはせず、未送信として持ち越す
      state.offline = true;
      if (manual) showToast('通信できませんでした。あとで自動で同期します。');
    } else {
      state.sync = { ...state.sync, lastError: (e && e.message) || String(e) };
      console.error(e);
    }
  } finally {
    state.syncing = false;
    try { await putMeta('sync', state.sync); } catch { /* 表示には影響しない */ }
    render();
  }
  if (syncAgain || (Object.keys(state.pending).length && !state.offline && !state.sync.lastError)) scheduleSync(1000);
}

/* =========================================================
 * Claude Code への整理の依頼
 * データ用リポジトリの .github/workflows/organize.yml(GitHub Actions)を起動し、
 * Claude Code が CLAUDE.md のルールでインボックスを振り分ける。終わったら同期して取り込む
 * ======================================================= */
const ORGANIZE_WORKFLOW = 'organize.yml';
const ORGANIZE_TIMEOUT = 30 * 60 * 1000;
let organizeTimer = null;
let organizeRequesting = false;
function workflowPath() {
  return `${repoPath()}/actions/workflows/${ORGANIZE_WORKFLOW}`;
}
// 依頼中の状態(再読み込みしても続きを見守れるよう端末に保存)
function organizeState() {
  if (organizeRequesting) return { requesting: true };
  try {
    const o = JSON.parse(localStorage.getItem('organize') || 'null');
    return o && Date.now() - o.at < ORGANIZE_TIMEOUT ? o : null;
  } catch { return null; }
}
function setOrganizeState(o) {
  try { if (o) localStorage.setItem('organize', JSON.stringify(o)); else localStorage.removeItem('organize'); } catch { /* 保存できなくても続ける */ }
}
function organizeBtnHtml() {
  if (!syncConfigured()) return '';
  const st = organizeState();
  const label = !st ? 'Claude にインボックスの整理を頼む'
    : st.requesting ? '整理を依頼しています…'
    : `Claude が整理しています…(${Math.max(1, Math.round((Date.now() - st.at) / 60000))}分経過)`;
  return `<button type="button" class="organize-btn" data-action="organize"${st ? ' disabled' : ''}>${esc(label)}</button>`;
}
async function organizeError(res) {
  if (res.status === 404) return new SyncError('データ用リポジトリに整理の仕組み(.github/workflows/organize.yml)が見つかりません。');
  if (res.status === 403) return new SyncError('アクセストークンに Actions の権限(Read and write)がありません。README の「整理ボタンの準備」を参照してください。');
  return errorFrom(res, '整理の依頼');
}
async function latestRunId() {
  const res = await gh(`${workflowPath()}/runs?per_page=1`);
  if (!res.ok) throw await organizeError(res);
  const runs = (await res.json()).workflow_runs || [];
  return runs.length ? runs[0].id : 0;
}
async function waitForSync() {
  while (state.syncing) await new Promise(r => setTimeout(r, 300));
  await syncNow(false);
}
async function requestOrganize() {
  if (!syncConfigured()) { showToast('GitHub との同期を設定すると使えます'); return; }
  if (organizeState()) return;
  if (!navigator.onLine) { showToast('オフラインのため依頼できません'); return; }
  organizeRequesting = true;
  render();
  try {
    await waitForSync(); // 端末で投げ込んだ分を先に GitHub へ送る
    if (Object.keys(state.pending).length) throw new SyncError('未送信の変更を送れませんでした。同期の状態を確認してから、もう一度お試しください。');
    const baseline = await latestRunId();
    const res = await gh(`${workflowPath()}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: state.settings.branch }) });
    if (!res.ok) throw await organizeError(res);
    organizeRequesting = false;
    setOrganizeState({ baseline, at: Date.now() });
    showToast('整理を依頼しました。数分かかります');
    pollOrganize(15000);
  } catch (e) {
    organizeRequesting = false;
    finishOrganize();
    showToast(e && e.network ? '通信できませんでした。あとでもう一度お試しください。' : (e && e.message) || String(e));
  }
  render();
}
function pollOrganize(delay) {
  clearTimeout(organizeTimer);
  organizeTimer = setTimeout(checkOrganize, delay);
}
async function checkOrganize() {
  const st = organizeState();
  if (!st) { finishOrganize(); showToast('整理の結果を確認できませんでした。しばらくしてから同期してください'); return; }
  if (st.requesting) return;
  render(); // 経過時間の表示を更新
  try {
    const res = await gh(`${workflowPath()}/runs?per_page=5`);
    if (!res.ok) throw await organizeError(res);
    const runs = ((await res.json()).workflow_runs || []).filter(r => r.id > st.baseline).sort((a, b) => a.id - b.id);
    const run = runs[0];
    if (run && run.status === 'completed') {
      finishOrganize();
      if (run.conclusion === 'success') {
        await waitForSync();
        showToast('整理が終わりました');
      } else {
        showToast('整理に失敗しました。データ用リポジトリの Actions で記録を確認できます');
      }
      return;
    }
  } catch (e) {
    if (!(e && e.network)) { finishOrganize(); showToast((e && e.message) || String(e)); return; }
  }
  pollOrganize(15000);
}
function finishOrganize() {
  clearTimeout(organizeTimer);
  setOrganizeState(null);
  render();
}

/* =========================================================
 * ?add= による投げ込み(音声入力ショートカット用)
 * ======================================================= */
async function handleAddParam() {
  const url = new URL(location.href);
  if (!url.searchParams.has('add')) return;
  const text = url.searchParams.get('add') || '';
  // 再読み込みで二重に追加されないよう、先に URL から取り除く
  url.searchParams.delete('add');
  history.replaceState(null, '', url.pathname + (url.search || '') + url.hash);
  if (!text.trim()) return;
  try {
    await addItem(text, 'inbox');
    showToast('インボックスに追加しました: ' + firstLine(text).slice(0, 30));
  } catch { /* saveLocal が通知済み */ }
}

/* =========================================================
 * 起動
 * ======================================================= */
async function start() {
  bindEvents();
  try {
    await loadAll();
  } catch (e) {
    showToast('端末内のデータを読み込めませんでした: ' + (e && e.message || e));
  }
  applyRoute();
  await handleAddParam();
  if (route.view === 'home') $('#capture-text').focus();

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker を登録できませんでした', e));
  // 起動時の同期は表示のあとに裏で行う(通信を待たない)
  scheduleSync(300);
  // 整理を依頼したまま閉じていた場合は、続きを見守る
  if (organizeState()) pollOrganize(1000);
}
start();
</script>
